<!doctype html><html><head><base target="_top"><style>
body{font:14px Arial,sans-serif;color:#263238;padding:12px}h2{font-size:18px;margin:0 0 12px}.card{border:1px solid #d7dfe5;border-radius:8px;padding:12px;margin:10px 0}.muted{color:#607d8b;font-size:12px}.overdue{color:#b71c1c;font-weight:bold}label{display:block;margin-top:8px;font-weight:bold}input,textarea{box-sizing:border-box;width:100%;padding:7px;margin-top:3px;border:1px solid #bac6cc;border-radius:4px}button{background:#1565c0;color:white;border:0;padding:9px 12px;border-radius:4px;margin-top:10px;cursor:pointer}button:disabled{opacity:.55}.error{color:#b71c1c}.ok{color:#256029}
</style></head><body><h2>My pending tasks</h2><div id="status">Loading…</div><div id="receipt"></div><div id="tasks"></div><div id="recent"></div><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let qaView=false,lastSubmission=null,recentCompletions=[];
function loadRecent(){google.script.run.withSuccessHandler(rows=>{recentCompletions=rows;document.getElementById("recent").innerHTML=rows.length?"<h3>QA replay: recorded completions</h3>"+rows.map((c,i)=>`<div class="card"><strong>${esc(c.id)}</strong><div class="muted">Completed ${esc(c.completedAt)}</div><button onclick="replayRecent(${i})">Repeat recorded submission</button></div>`).join(""):"";}).withFailureHandler(e=>document.getElementById("recent").textContent=e.message).myRecentCompletions();}
function replayRecent(i){lastSubmission=recentCompletions[i];repeatLast();}
function repeatLast(){if(!lastSubmission)return;google.script.run.withSuccessHandler(r=>{const box=document.getElementById("receipt");if(box)box.textContent=r.duplicate?"Duplicate prevented: existing completion retained":"Unexpected new completion";}).withFailureHandler(e=>{const box=document.getElementById("receipt");if(box)box.textContent=e.message;}).submitCompletion(lastSubmission.id,lastSubmission.proof);}
function load(){google.script.run.withSuccessHandler(rows=>{qaView=rows.some(c=>c.testMode);document.getElementById('status').textContent=rows.length?(rows[0]?.testMode?'TEST MODE · '+rows[0].businessNow+' · ':'')+rows.length+' task(s) require action':'All caught up';document.getElementById('tasks').innerHTML=rows.map(c=>`<div class="card"><strong>${esc(c.task)}</strong><div class="muted">${esc(c.id)} · Due ${esc(c.dueAt)}</div><div class="${Date.parse(c.dueAt)<Date.parse(c.businessNow||new Date().toISOString())?'overdue':'muted'}">${Date.parse(c.dueAt)<Date.parse(c.businessNow||new Date().toISOString())?'Overdue':'Pending'}</div>${c.proofType==='ticket'?`<label>Ticket ID<input id="ticket-${esc(c.id)}" maxlength="80" placeholder="e.g. OPS-1234"></label>`:`<label>Work completed today<textarea id="completed-${esc(c.id)}"></textarea></label><label>Pending work<textarea id="pending-${esc(c.id)}" placeholder="None if clear"></textarea></label><label>Pending count<input id="count-${esc(c.id)}" type="number" min="0" value="0"></label><label>Blockers or issues<textarea id="blockers-${esc(c.id)}" placeholder="None if clear"></textarea></label><label>Remarks (optional)<textarea id="remarks-${esc(c.id)}"></textarea></label>`}<button onclick="submit('${esc(c.id)}',this)">Submit completion</button><div id="msg-${esc(c.id)}"></div></div>`).join('');if(qaView)loadRecent();}).withFailureHandler(e=>{document.getElementById('status').textContent=e.message;document.getElementById('status').className='error';}).myTasks();}
function submit(id,button){button.disabled=true;const g=x=>document.getElementById(x+'-'+id)?.value||'';const proof=document.getElementById('ticket-'+id)?{ticketId:g('ticket')}:{report:{completed:g('completed'),pending:g('pending'),pendingCount:g('count'),blockers:g('blockers'),remarks:g('remarks')}};google.script.run.withSuccessHandler(r=>{if(qaView){lastSubmission={id,proof};const box=document.getElementById('receipt');if(box)box.innerHTML='Recorded '+esc(id)+'<br><button onclick="repeatLast()">Repeat last submission (QA)</button>';}document.getElementById('msg-'+id).textContent=r.duplicate?'Already completed':'Completed and recorded';document.getElementById('msg-'+id).className='ok';setTimeout(load,900);}).withFailureHandler(e=>{button.disabled=false;document.getElementById('msg-'+id).textContent=e.message;document.getElementById('msg-'+id).className='error';}).submitCompletion(id,proof);}
load();</script></body></html>

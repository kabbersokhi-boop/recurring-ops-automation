<!doctype html><html><head><base target="_top"><style>
body{font:14px Arial,sans-serif;color:#263238;padding:12px}h2{font-size:18px;margin:0 0 12px}.card{border:1px solid #d7dfe5;border-radius:8px;padding:12px;margin:10px 0}.muted{color:#607d8b;font-size:12px}.overdue{color:#b71c1c;font-weight:bold}label{display:block;margin-top:8px;font-weight:bold}input,textarea{box-sizing:border-box;width:100%;padding:7px;margin-top:3px;border:1px solid #bac6cc;border-radius:4px}button{background:#1565c0;color:white;border:0;padding:9px 12px;border-radius:4px;margin-top:10px;cursor:pointer}button:disabled{opacity:.55}.error{color:#b71c1c}.ok{color:#256029}
</style></head><body><h2>My pending tasks</h2><div id="status">Loading…</div><div id="tasks"></div><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){google.script.run.withSuccessHandler(rows=>{document.getElementById('status').textContent=rows.length?rows.length+' task(s) require action':'All caught up';document.getElementById('tasks').innerHTML=rows.map(c=>`<div class="card"><strong>${esc(c.task)}</strong><div class="muted">${esc(c.id)} · Due ${esc(c.dueAt)}</div><div class="${Date.parse(c.dueAt)<Date.now()?'overdue':'muted'}">${Date.parse(c.dueAt)<Date.now()?'Overdue':'Pending'}</div>${c.proofType==='ticket'?`<label>Ticket ID<input id="ticket-${esc(c.id)}" maxlength="80" placeholder="e.g. OPS-1234"></label>`:`<label>Work completed today<textarea id="completed-${esc(c.id)}"></textarea></label><label>Pending work<textarea id="pending-${esc(c.id)}" placeholder="None if clear"></textarea></label><label>Pending count<input id="count-${esc(c.id)}" type="number" min="0" value="0"></label><label>Blockers or issues<textarea id="blockers-${esc(c.id)}" placeholder="None if clear"></textarea></label><label>Remarks (optional)<textarea id="remarks-${esc(c.id)}"></textarea></label>`}<button onclick="submit('${esc(c.id)}',this)">Submit completion</button><div id="msg-${esc(c.id)}"></div></div>`).join('');}).withFailureHandler(e=>{document.getElementById('status').textContent=e.message;document.getElementById('status').className='error';}).myTasks();}
function submit(id,button){button.disabled=true;const g=x=>document.getElementById(x+'-'+id)?.value||'';const proof=document.getElementById('ticket-'+id)?{ticketId:g('ticket')}:{report:{completed:g('completed'),pending:g('pending'),pendingCount:g('count'),blockers:g('blockers'),remarks:g('remarks')}};google.script.run.withSuccessHandler(r=>{document.getElementById('msg-'+id).textContent=r.duplicate?'Already completed':'Completed and recorded';document.getElementById('msg-'+id).className='ok';setTimeout(load,900);}).withFailureHandler(e=>{button.disabled=false;document.getElementById('msg-'+id).textContent=e.message;document.getElementById('msg-'+id).className='error';}).submitCompletion(id,proof);}
load();</script></body></html>

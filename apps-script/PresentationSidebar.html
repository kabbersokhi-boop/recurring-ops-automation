<!doctype html><html><head><base target="_top"><style>body{font:14px Arial,sans-serif;color:#1c2e45;padding:12px;background:#f6f8fb;margin:0;line-height:1.4}h2{font-size:19px;font-weight:600;margin:8px 0 14px;color:#1c2e45}h3{font-size:14px;font-weight:600;color:#526675}.card{background:#fff;border:1px solid #e2e8ee;border-radius:10px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #1c2e4508}.muted{color:#687b8c;font-size:12px;line-height:1.45}.overdue,.red{color:#9f4239;font-weight:600}label{display:block;margin-top:12px;font-size:12px;font-weight:600;color:#526675}input,textarea{box-sizing:border-box;width:100%;padding:9px;margin-top:5px;border:1px solid #d5dfe7;border-radius:7px;background:#fff;color:#1c2e45;font:13px Arial,sans-serif;line-height:1.4}textarea{min-height:66px;resize:vertical}input:focus,textarea:focus{outline:2px solid #2b71742b;border-color:#2b7174}button{background:#2b7174;color:white;border:0;padding:11px 13px;border-radius:7px;margin-top:13px;cursor:pointer;font:600 13px Arial,sans-serif;width:100%}button:hover{background:#235d60}button:disabled{opacity:.5;cursor:default}.error{color:#9f4239}.ok{color:#2b7174}#status{font-size:12px;color:#687b8c;margin-bottom:14px}#receipt{font-size:12px;color:#2b7174}strong{color:#1c2e45}</style></head><body><h2>My pending tasks</h2><div id="status">Loading…</div><div id="receipt"></div><div id="tasks"></div><div id="recent"></div><script>
const sidebarIdentity=()=>typeof qaSidebarIdentityToken==='string'?qaSidebarIdentityToken:undefined;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let qaView=false,lastSubmission=null,recentCompletions=[];
function loadRecent(){google.script.run.withSuccessHandler(rows=>{recentCompletions=rows;document.getElementById("recent").innerHTML=rows.length?"<h3>QA replay: recorded completions</h3>"+rows.map((c,i)=>`<div class="card"><strong>${esc(c.id)}</strong><div class="muted">Completed ${esc(c.completedAt)}</div><button onclick="replayRecent(${i})">Repeat recorded submission</button></div>`).join(""):"";}).withFailureHandler(e=>document.getElementById("recent").textContent=e.message).myRecentCompletions(sidebarIdentity());}
function replayRecent(i){lastSubmission=recentCompletions[i];repeatLast();}
function repeatLast(){if(!lastSubmission)return;google.script.run.withSuccessHandler(r=>{const box=document.getElementById("receipt");if(box)box.textContent=r.duplicate?"Duplicate prevented: existing completion retained":"Unexpected new completion";}).withFailureHandler(e=>{const box=document.getElementById("receipt");if(box)box.textContent=e.message;}).submitCompletion(lastSubmission.id,lastSubmission.proof,sidebarIdentity());}
function actionable(c){return Date.parse(c.businessNow||new Date().toISOString())>=Date.parse(c.dueDay+'T00:00:00'+c.dueAt.slice(-6));}
function load(){google.script.run.withSuccessHandler(rows=>{qaView=rows.some(c=>c.testMode);document.getElementById('status').textContent=rows.length?(rows[0]?.testMode?'TEST MODE · '+rows[0].businessNow+' · ':'')+rows.filter(actionable).length+' task(s) require action'+(rows.some(c=>!actionable(c))?' · '+rows.filter(c=>!actionable(c)).length+' upcoming':''):'All caught up';document.getElementById('tasks').innerHTML=rows.map(c=>`<div class="card"><strong>${esc(c.task)}</strong><div class="muted">${esc(c.id)} · Due ${esc(c.dueAt)}</div><div class="${Date.parse(c.dueAt)<Date.parse(c.businessNow||new Date().toISOString())?'overdue':'muted'}">${Date.parse(c.dueAt)<Date.parse(c.businessNow||new Date().toISOString())?'Overdue':actionable(c)?'Pending':'Upcoming — available on due day'}</div>${c.proofType==='ticket'?`<label>Ticket ID<input id="ticket-${esc(c.id)}" maxlength="80" placeholder="e.g. OPS-1234"></label>`:`<label>Work completed today<textarea id="completed-${esc(c.id)}"></textarea></label><label>Pending work<textarea id="pending-${esc(c.id)}" placeholder="None if clear"></textarea></label><label>Pending count<input id="count-${esc(c.id)}" type="number" min="0" value="0"></label><label>Blockers or issues<textarea id="blockers-${esc(c.id)}" placeholder="None if clear"></textarea></label><label>Remarks (optional)<textarea id="remarks-${esc(c.id)}"></textarea></label>`}<button ${actionable(c)?'':'disabled'} onclick="submit('${esc(c.id)}',this)">Submit completion</button><div id="msg-${esc(c.id)}"></div></div>`).join('');if(qaView)loadRecent();}).withFailureHandler(e=>{document.getElementById('status').textContent=e.message;document.getElementById('status').className='error';}).myTasks(sidebarIdentity());}
function submit(id,button){button.disabled=true;const g=x=>document.getElementById(x+'-'+id)?.value||'';const proof=document.getElementById('ticket-'+id)?{ticketId:g('ticket')}:{report:{completed:g('completed'),pending:g('pending'),pendingCount:g('count'),blockers:g('blockers'),remarks:g('remarks')}};google.script.run.withSuccessHandler(r=>{if(qaView){lastSubmission={id,proof};const box=document.getElementById('receipt');if(box)box.innerHTML='Recorded '+esc(id)+'<br><button onclick="repeatLast()">Repeat last submission (QA)</button>';}document.getElementById('msg-'+id).textContent=r.duplicate?'Already completed':'Completed and recorded';document.getElementById('msg-'+id).className='ok';setTimeout(load,900);}).withFailureHandler(e=>{button.disabled=false;document.getElementById('msg-'+id).textContent=e.message;document.getElementById('msg-'+id).className='error';}).submitCompletion(id,proof,sidebarIdentity());}
load();</script></body></html>

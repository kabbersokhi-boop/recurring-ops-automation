<!doctype html><html><head><base target="_top"><style>body{font:14px Arial,sans-serif;color:#263238;padding:12px}.card{border:1px solid #d7dfe5;border-radius:8px;padding:10px;margin:9px 0}.muted{color:#607d8b;font-size:12px}.red{color:#b71c1c}button{background:#1565c0;color:#fff;border:0;border-radius:4px;padding:8px 10px;margin-top:7px;cursor:pointer}</style></head><body><h2>Manager review</h2><div id="status">Loading…</div><div id="issues"></div><script>
const sidebarIdentity=()=>typeof qaSidebarIdentityToken==='string'?qaSidebarIdentityToken:undefined;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function proofSummary(c){if(c.ticketId)return e(c.ticketId);if(!c.report)return 'No completion proof yet';const r=c.report;return 'Completed: '+e(r.completed)+'<br>Pending ('+e(r.pendingCount)+'): '+e(r.pending)+'<br>Blockers: '+e(r.blockers)+(r.remarks?'<br>Remarks: '+e(r.remarks):'');}
function load(){google.script.run.withSuccessHandler(rows=>{rows=rows.slice().sort((a,b)=>Number(b.status==='Pending'&&b.overdueMinutes>0)-Number(a.status==='Pending'&&a.overdueMinutes>0)||Date.parse(a.dueAt)-Date.parse(b.dueAt));document.getElementById('status').textContent=rows.length+' task cycle(s)';document.getElementById('issues').innerHTML=rows.map(c=>`<div class="card"><strong>${e(c.task)}</strong> · ${e(c.employee)}${c.employeeId?' · '+e(c.employeeId):''}<div class="muted">${e(c.id)}<br>Due ${e(c.dueAt)}<br>Acknowledge by ${e(c.acknowledgementDueAt)}<br>Escalation ${e(c.escalationAt)}</div><div class="${c.overdueMinutes?'red':''}">${e(c.status==='Pending'&&c.overdueMinutes?'Overdue (Pending)':c.status)} · ${c.overdueMinutes} minutes overdue</div><div>Proof: ${proofSummary(c)}</div>${c.completedAt?`<div>${e(c.completionMode||'AUTHENTICATED (earlier QA run)')} completion: ${e(c.completedAt)}<br>Completed by: ${e(c.completedBy)}${c.simulatedBy?'<br>Simulation initiated by: '+e(c.simulatedBy):''}<br>Next cycle: ${e(c.nextCycle||'Daily scheduler')}</div>`:''}<div class="${c.acknowledgementLate?'red':''}">Acknowledgement: ${e(c.acknowledgedAt|| (c.acknowledgementLate?'Late':'Pending'))}${c.acknowledgedBy?' · '+e(c.acknowledgedBy):''}</div>${c.alerted&&!c.acknowledgedAt?`<button onclick="ack('${e(c.id)}')">Acknowledge alert</button>`:''}</div>`).join('');}).withFailureHandler(err=>document.getElementById('status').textContent=err.message).managerIssues(sidebarIdentity());}
function ack(id){google.script.run.withSuccessHandler(load).withFailureHandler(err=>alert(err.message)).managerAcknowledge(id,sidebarIdentity())}load();
</script></body></html>

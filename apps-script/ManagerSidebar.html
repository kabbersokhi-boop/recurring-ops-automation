<!doctype html><html><head><base target="_top"><style>body{font:14px Arial,sans-serif;color:#263238;padding:12px}.card{border:1px solid #d7dfe5;border-radius:8px;padding:10px;margin:9px 0}.muted{color:#607d8b;font-size:12px}.red{color:#b71c1c}button{background:#1565c0;color:#fff;border:0;border-radius:4px;padding:8px 10px;margin-top:7px;cursor:pointer}</style></head><body><h2>Manager review</h2><div id="status">Loading…</div><div id="issues"></div><script>
const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){google.script.run.withSuccessHandler(rows=>{document.getElementById('status').textContent=rows.length+' open or alerted issue(s)';document.getElementById('issues').innerHTML=rows.map(c=>`<div class="card"><strong>${e(c.task)}</strong> · ${e(c.employee)}<div class="muted">${e(c.id)}<br>Due ${e(c.dueAt)}<br>Acknowledge by ${e(c.acknowledgementDueAt)}<br>Escalation ${e(c.escalationAt)}</div><div class="${c.overdueMinutes?'red':''}">${e(c.status)} · ${c.overdueMinutes} minutes overdue</div><div>Proof: ${e(c.ticketId||JSON.stringify(c.report||''))}</div><div class="${c.acknowledgementLate?'red':''}">Acknowledgement: ${e(c.acknowledgedAt|| (c.acknowledgementLate?'Late':'Pending'))}</div>${c.alerted&&!c.acknowledgedAt?`<button onclick="ack('${e(c.id)}')">Acknowledge alert</button>`:''}</div>`).join('');}).withFailureHandler(err=>document.getElementById('status').textContent=err.message).managerIssues();}
function ack(id){google.script.run.withSuccessHandler(load).withFailureHandler(err=>alert(err.message)).managerAcknowledge(id)}load();
</script></body></html>
